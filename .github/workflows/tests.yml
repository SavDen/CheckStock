name: PostgreSQL integration tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: checkstock
          POSTGRES_PASSWORD: checkstock
          POSTGRES_DB: checkstock_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U checkstock"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://checkstock:checkstock@localhost:5432/checkstock_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests alembic
      - run: pytest -q
      - run: docker compose config -q
