services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: checkstock
      POSTGRES_PASSWORD: checkstock
      POSTGRES_DB: checkstock
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkstock -d checkstock"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:5432:5432"
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://checkstock:checkstock@db:5432/checkstock
      SEED_DEMO: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  test:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://checkstock:checkstock@db:5432/checkstock_test
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
